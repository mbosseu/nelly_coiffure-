# Configuration Netlify (équivalent de vercel.json). Le projet Netlify a « site » comme dossier de base.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Redirections permanentes reprises de vercel.json ---
[[redirects]]
  from = "/tarifs.html"
  to = "/coiffures.html#carte"
  status = 301
  force = true

[[redirects]]
  from = "/tarifs"
  to = "/coiffures.html#carte"
  status = 301
  force = true

# --- Ne jamais servir le code des fonctions ni la configuration comme fichiers ---
[[redirects]]
  from = "/api/_lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/admin.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/envoi.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/mcp.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/oauth.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/stats.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true

# --- En-têtes repris de vercel.json ---
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
